# If you do not use the Latin-1 (ISO-8859-1) charset, you should tell
# GnuPG which is the native character set.  Please check the man page
# for supported character sets.  This character set is only used for
# metadata and not for the actual message which does not undergo any
# translation.  Note that future version of GnuPG will change to UTF-8
# as default character set.  In most cases this option is not required
# as GnuPG is able to figure out the correct charset at runtime.
charset utf-8

# Set the pinentry mode to loopback. This will allow to redirect
# Pinentry queries to the caller.
pinentry-mode loopback

# If you have more than 1 secret key in your keyring, you may want to
# uncomment the following option and set your preferred keyid.
default-key 6D980FFA0624AF79

# Keyserver access is done by dirmngr since GnuPG 2.1, so the keyserver is
# configured in dirmngr.conf and a 'keyserver' line here has no effect.
# The old hkp://keys.gnupg.net that used to be configured here no longer
# resolves at all, the SKS pool it pointed to is gone.

# zlib compression level applied to the plaintext before it gets encrypted or
# inline signed. 0 turns compression off, 1-9 trade speed for size and without
# the option gpg uses the zlib default. Detached signatures like the ones git
# makes are not compressed at all, so this only concerns encrypted files such
# as the .org.gpg ones, which stay bigger than necessary with 0.
compress-level 0

# Print full 64 bit key ids with a 0x prefix instead of the short 32 bit form.
# Short key ids are ambiguous, colliding ones can be generated on purpose, so
# they are not safe to identify a key by.
keyid-format 0xlong

# Print the fingerprint of every subkey in key listings, not only the one of
# the primary key. Makes it visible which subkey actually signs or encrypts,
# e.g. that encryption goes to the [E] subkey and not to the primary one.
with-subkey-fingerprint
