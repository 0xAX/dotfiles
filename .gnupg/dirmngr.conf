# Keyserver used to fetch and send keys. keys.openpgp.org verifies email
# addresses before publishing a user ID and strips third party signatures,
# which keeps lookups small and free of the SKS poisoning problem.
# Without this file the compiled-in default hkps://keyserver.ubuntu.com is
# used, which publishes anything unverified.
keyserver hkps://keys.openpgp.org
