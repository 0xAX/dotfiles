# Allow to use a loopback pinentry to redirect pinentry queries to the caller.
allow-loopback-pinentry

# Inactivity timeout: how long a cached passphrase survives without being used.
# Every use of the cache restarts this timer, so signing regularly keeps the
# passphrase alive indefinitely and only a gap of 8 hours forgets it.
default-cache-ttl 28800

# Absolute timeout: the maximum lifetime of a cache entry, counted from the
# moment the passphrase was typed. Using the cache does NOT extend it, so the
# passphrase is asked for again 16 hours after entry however busy the day was.
# Must be larger than default-cache-ttl to mean anything: with both set to the
# same value this one always expires first and the inactivity timeout above
# can never come into play.
max-cache-ttl 57600
